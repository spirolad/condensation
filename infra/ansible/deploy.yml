---
# ==============================================================================
# PLAY 1 : Récupération des secrets et variables depuis AWS (via le Runner CI)
# ==============================================================================
- name: Fetch Secrets and Config from AWS
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    aws_region: "us-east-1"
    env_name: "{{ env_name }}"
  tasks:
    # 1. Récupérer l'ARN du secret RDS
    - name: Get RDS Secret ARN from SSM Parameter Store
      command: >
        aws ssm get-parameter 
        --name "/{{ env_name }}/rds_db_secret" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: db_secret_arn_output
      changed_when: false

    # 2. Utiliser l'ARN pour lire le secret réel
    - name: Get RDS Secret Credentials using ARN
      command: >
        aws secretsmanager get-secret-value 
        --secret-id "{{ db_secret_arn_output.stdout }}" 
        --query 'SecretString' --output text --region {{ aws_region }}
      register: rds_secret_raw
      changed_when: false

    # 3. Transformer le JSON récupéré en variables utilisables
    - name: Parse RDS Secret JSON
      set_fact:
        db_creds: "{{ rds_secret_raw.stdout | from_json }}"

    # 4. Récupérer l'endpoint (URL) de la BDD
    - name: Get RDS Endpoint from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/rds_endpoint" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: rds_endpoint_raw
      changed_when: false

    # 5. Récupérer le nom de la BDD pour Auth
    - name: Get Auth DB Name from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/auth_database_name" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: auth_dbname_raw
      changed_when: false

    # 6. Récupérer le nom de la BDD pour Game/Catalog
    - name: Get Game DB Name from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/game_database_name" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: game_dbname_raw
      changed_when: false

    # 7. Récupérer l'Instance ID EC2 depuis SSM
    - name: Get EC2 Instance ID from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/ec2_instance_id" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: ec2_instance_id_raw
      changed_when: false

    # 8. Récupérer l'IP publique EC2 depuis SSM
    - name: Get EC2 Public IP from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/ec2_public_ip" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: ec2_public_ip_raw
      changed_when: false

    # 9. Récupérer l'IP privée EC2 depuis SSM
    - name: Get EC2 Private IP from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/ec2_private_ip" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: ec2_private_ip_raw
      changed_when: false

    # 10. Récupérer le nom de la clé SSH depuis SSM
    - name: Get EC2 Key Pair Name from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/ec2_key_pair_name" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: ec2_key_pair_name_raw
      changed_when: false

    # 11. Récupérer le nom du secret de clé privée depuis SSM
    - name: Get EC2 Secret Key Name from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/ec2_secret_key_name" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: ec2_secret_key_name_raw
      changed_when: false

    # 12. Récupérer les URLs ECR depuis SSM
    - name: Get ECR Frontend URL from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/ecr_frontend_url" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: ecr_frontend_url_raw
      changed_when: false

    - name: Get ECR Backend URL from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/ecr_backend_url" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: ecr_backend_url_raw
      changed_when: false

    - name: Get ECR Auth URL from SSM
      command: >
        aws ssm get-parameter --name "/{{ env_name }}/ecr_auth_url" 
        --query 'Parameter.Value' --output text --region {{ aws_region }}
      register: ecr_auth_url_raw
      changed_when: false

# ==============================================================================
# PLAY 2 : Installation et Déploiement sur l'instance EC2
# ==============================================================================
- name: Configure EC2 and Deploy Application
  hosts: all
  remote_user: ec2-user
  become: yes
  vars:
    # Récupération des variables collectées dans le Play 1
    db_username: "{{ hostvars['localhost']['db_creds']['username'] }}"
    db_password: "{{ hostvars['localhost']['db_creds']['password'] }}"
    db_endpoint: "{{ hostvars['localhost']['rds_endpoint_raw']['stdout'] }}"
    auth_db_name: "{{ hostvars['localhost']['auth_dbname_raw']['stdout'] }}"
    game_db_name: "{{ hostvars['localhost']['game_dbname_raw']['stdout'] }}"
    db_port:     "5432"
    
    # Paramètres EC2 depuis SSM
    ec2_instance_id: "{{ hostvars['localhost']['ec2_instance_id_raw']['stdout'] }}"
    ec2_public_ip: "{{ hostvars['localhost']['ec2_public_ip_raw']['stdout'] }}"
    ec2_private_ip: "{{ hostvars['localhost']['ec2_private_ip_raw']['stdout'] }}"
    ec2_key_pair_name: "{{ hostvars['localhost']['ec2_key_pair_name_raw']['stdout'] }}"
    ec2_secret_key_name: "{{ hostvars['localhost']['ec2_secret_key_name_raw']['stdout'] }}"
    
    aws_region: "us-east-1"
    
    # URLs ECR depuis SSM
    ecr_frontend_url: "{{ hostvars['localhost']['ecr_frontend_url_raw']['stdout'] }}"
    ecr_backend_url: "{{ hostvars['localhost']['ecr_backend_url_raw']['stdout'] }}"
    ecr_auth_url: "{{ hostvars['localhost']['ecr_auth_url_raw']['stdout'] }}"

  tasks:
    # --- INSTALLATION DES DÉPENDANCES ---
    
    - name: Display EC2 and Database Information
      debug:
        msg:
          - "EC2 Instance ID: {{ ec2_instance_id }}"
          - "EC2 Public IP: {{ ec2_public_ip }}"
          - "EC2 Private IP: {{ ec2_private_ip }}"
          - "EC2 Key Pair: {{ ec2_key_pair_name }}"
          - "DB Endpoint: {{ db_endpoint }}"
          - "DB Port: {{ db_port }}"
          - "Auth DB: {{ auth_db_name }}"
          - "Game DB: {{ game_db_name }}"
          - "ECR Frontend: {{ ecr_frontend_url }}"
          - "ECR Backend: {{ ecr_backend_url }}"
          - "ECR Auth: {{ ecr_auth_url }}"

    - name: Update system packages
      yum:
        name: "*"
        state: latest
        update_cache: yes

    - name: Install Docker, Git and AWS CLI
      yum:
        name:
          - docker
          - git
          - awscli 
        state: present

    - name: Start and Enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Docker Compose (Standalone Binary)
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    # --- DÉPLOIEMENT DE L'APPLICATION ---

    - name: Create application directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
      loop:
        - /home/ec2-user/app
        - /home/ec2-user/app/monitoring
        - /home/ec2-user/app/monitoring/grafana
        - /home/ec2-user/app/monitoring/grafana/provisioning
        - /home/ec2-user/app/monitoring/grafana/dashboards

    - name: Validate required variables are not empty
      assert:
        that:
          - ecr_frontend_url | length > 0
          - ecr_backend_url | length > 0
          - ecr_auth_url | length > 0
          - db_endpoint | length > 0
          - db_username | length > 0
          - db_password | length > 0
          - auth_db_name | length > 0
          - game_db_name | length > 0
        fail_msg: "ERROR: One or more required variables are empty!"

    - name: Generate docker-compose.yml from template
      template:
        src: docker-compose.yml.j2
        dest: /home/ec2-user/app/docker-compose.yml
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Validate generated docker-compose.yml has no unresolved variables
      shell: |
        if grep -E '\{\{.*\}\}' /home/ec2-user/app/docker-compose.yml; then
          echo "ERROR: Found unresolved Jinja2 variables in docker-compose.yml"
          exit 1
        fi
        echo "✓ docker-compose.yml successfully generated with all variables resolved"
      changed_when: false

    - name: Display generated docker-compose.yml (for debugging)
      shell: cat /home/ec2-user/app/docker-compose.yml
      register: docker_compose_content
      changed_when: false

    - name: Show docker-compose content
      debug:
        msg: "{{ docker_compose_content.stdout_lines }}"
        verbosity: 1

    - name: Login to ECR on the EC2 instance
      shell: |
        ECR_DOMAIN=$(echo "{{ ecr_frontend_url }}" | cut -d'/' -f1)
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin $ECR_DOMAIN
      register: ecr_login
      changed_when: false

    - name: Verify ECR images exist
      shell: |
        set -e
        ECR_DOMAIN=$(echo "{{ ecr_frontend_url }}" | cut -d'/' -f1)
        
        check_image() {
          local image_url=$1
          local image_name=$(echo $image_url | awk -F'/' '{print $2}' | cut -d':' -f1)
          if ! aws ecr describe-images --repository-name $image_name --region {{ aws_region }} &>/dev/null; then
            echo "ERROR: Image not found in ECR: $image_url"
            echo "Please build and push Docker images first:"
            echo "  - {{ ecr_frontend_url }}:latest"
            echo "  - {{ ecr_backend_url }}:latest"
            echo "  - {{ ecr_auth_url }}:latest"
            return 1
          fi
        }
        
        check_image "{{ ecr_frontend_url }}"
        check_image "{{ ecr_backend_url }}"
        check_image "{{ ecr_auth_url }}"
      register: image_check
      changed_when: false
      failed_when: image_check.rc != 0

    - name: Create default monitoring files if they don't exist
      copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      loop:
        - dest: /home/ec2-user/app/monitoring/prometheus.yml
          content: |
            global:
              scrape_interval: 15s
              evaluation_interval: 15s
            scrape_configs:
              - job_name: 'prometheus'
                static_configs:
                  - targets: ['localhost:9090']
              - job_name: 'backend'
                static_configs:
                  - targets: ['backend:8080']

    - name: Deploy containers (Down, Pull, Up)
      shell: |
        set -e
        cd /home/ec2-user/app
        
        echo "========== Stopping previous containers =========="
        /usr/local/bin/docker-compose down --remove-orphans || true
        
        echo "========== Pulling latest images =========="
        /usr/local/bin/docker-compose pull
        
        echo "========== Starting containers =========="
        /usr/local/bin/docker-compose up -d
        
        sleep 10
        echo "========== Deployment complete =========="
      register: deploy_output
      changed_when: "'Pulling' in deploy_output.stdout"

    - name: Display deployment output
      debug:
        msg: "{{ deploy_output.stdout_lines }}"

    - name: Wait for services to be healthy
      shell: |
        echo "Waiting for services to be healthy..."
        
        # Check Auth service
        echo -n "Auth service: "
        for i in {1..30}; do
          if docker logs auth 2>&1 | grep -q "Application ready"; then
            echo "✓ READY"
            break
          fi
          if [ $i -eq 30 ]; then echo "✗ TIMEOUT"; fi
          sleep 2
        done
        
        # Check Backend service  
        echo -n "Backend service: "
        for i in {1..30}; do
          if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "✓ READY"
            break
          fi
          if [ $i -eq 30 ]; then echo "✗ TIMEOUT"; fi
          sleep 2
        done
        
        # Check Frontend service
        echo -n "Frontend service: "
        for i in {1..30}; do
          if curl -sf http://localhost/ > /dev/null 2>&1; then
            echo "✓ READY"
            break
          fi
          if [ $i -eq 30 ]; then echo "✗ TIMEOUT"; fi
          sleep 2
        done
        
        echo "All services initialization complete!"
      changed_when: false

    - name: Check container status
      shell: /usr/local/bin/docker-compose ps
      args:
        chdir: /home/ec2-user/app
      register: container_status
      changed_when: false

    - name: Display container status
      debug:
        msg: "{{ container_status.stdout_lines }}"

    - name: Show service logs for debugging
      shell: |
        echo "===== Auth Logs ====="
        docker logs auth --tail 20
        echo ""
        echo "===== Backend Logs ====="
        docker logs backend --tail 20
        echo ""
        echo "===== Frontend Logs ====="
        docker logs frontend --tail 20
      register: service_logs
      changed_when: false

    - name: Display service logs
      debug:
        msg: "{{ service_logs.stdout_lines }}"
        verbosity: 1

    # --- DEPLOYMENT SUMMARY ---

    - name: Display deployment summary
      debug:
        msg:
          - "╔════════════════════════════════════════════════════════════╗"
          - "║          DEPLOYMENT COMPLETED SUCCESSFULLY!               ║"
          - "╚════════════════════════════════════════════════════════════╝"
          - ""
          - "📍 EC2 INSTANCE INFORMATION:"
          - "   • Instance ID: {{ ec2_instance_id }}"
          - "   • Public IP: {{ ec2_public_ip }}"
          - "   • Private IP: {{ ec2_private_ip }}"
          - ""
          - "🔗 SERVICE ACCESS URLS:"
          - "   • Frontend: http://{{ ec2_public_ip }}:80"
          - "   • Auth Service: http://{{ ec2_public_ip }}:8000"
          - "   • Backend API: http://{{ ec2_public_ip }}:8080"
          - "   • Prometheus: http://{{ ec2_public_ip }}:9090"
          - "   • Grafana: http://{{ ec2_public_ip }}:3001"
          - ""
          - "📊 DATABASE INFORMATION:"
          - "   • Host: {{ db_endpoint }}"
          - "   • Port: {{ db_port }}"
          - "   • Auth Database: {{ auth_db_name }}"
          - "   • Game Database: {{ game_db_name }}"
          - ""
          - "🐳 DOCKER IMAGES:"
          - "   • Frontend: {{ ecr_frontend_url }}:latest"
          - "   • Backend: {{ ecr_backend_url }}:latest"
          - "   • Auth: {{ ecr_auth_url }}:latest"
          - ""
          - "📝 USEFUL COMMANDS:"
          - "   • View logs: ssh -i <key> ec2-user@{{ ec2_public_ip }} 'cd /home/ec2-user/app && docker-compose logs -f'"
          - "   • Container status: ssh -i <key> ec2-user@{{ ec2_public_ip }} 'cd /home/ec2-user/app && docker-compose ps'"
          - "   • Restart services: ssh -i <key> ec2-user@{{ ec2_public_ip }} 'cd /home/ec2-user/app && docker-compose restart'"
          - ""
          - "⚠️  COMMON ISSUES & TROUBLESHOOTING:"
          - "   1. Page loads infinitely:"
          - "      - Check backend logs: docker logs backend"
          - "      - Verify database connectivity: {{ db_endpoint }}:{{ db_port }}"
          - "      - Check frontend env vars are correct"
          - "   2. Services not responding:"
          - "      - Wait 60s for all services to be healthy"
          - "      - Check network connectivity between containers"
          - "      - Verify security group allows all necessary ports"
          - "   3. ECR login failed:"
          - "      - Verify IAM role has ECR permissions"
          - "      - Check AWS region is correct: {{ aws_region }}"

name: _Deploy with Terraform

on:
  workflow_call:
    inputs:
      env_name:
        description: "Environment name (e.g. dev, prod)"
        required: true
        type: string
      aws_region:
        description: "AWS region for provisioning"
        required: false
        default: "us-east-1"
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        description: "AWS Access Key ID"
        required: true
      AWS_SECRET_ACCESS_KEY:
        description: "AWS Secret Access Key"
        required: true
    outputs:
      public_ip:
        description: "EC2 instance public IP"
        value: ${{ jobs.terraform.outputs.public_ip }}
      secret_name:
        description: "Secrets Manager secret name"
        value: ${{ jobs.terraform.outputs.secret_name }}
  workflow_dispatch:
    inputs:
      env_name:
        description: "Environment name (e.g. dev, prod)"
        required: true
        type: string
      aws_region:
        description: "AWS region for provisioning"
        required: false
        default: "us-east-1"

jobs:
  terraform:
    name: Terraform Deploy to ${{ inputs.env_name }}
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.tf_outputs.outputs.public_ip }}
      secret_name: ${{ steps.tf_outputs.outputs.secret_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          python -m pip install --upgrade pip
          python -m pip install awscli

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Validate AWS credential environment
        run: |
          echo "AWS_ACCESS_KEY_ID set: ${AWS_ACCESS_KEY_ID:+yes}"
          echo "AWS_SECRET_ACCESS_KEY set: ${AWS_SECRET_ACCESS_KEY:+yes}"
          echo "AWS_SESSION_TOKEN set: ${AWS_SESSION_TOKEN:+yes}"
          aws configure list
          aws sts get-caller-identity

      - name: Terraform init
        working-directory: aws
        run: terraform init

      - name: Terraform plan
        working-directory: aws
        run: terraform plan -var-file="environnement/${{ inputs.env_name }}.tfvars"

      - name: Check existing AWS resources
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "Checking for existing AWS resources (env: ${{ inputs.env_name }})"
          echo "=========================================="
          
          ENV="${{ inputs.env_name }}"
          
          echo ""
          echo "=== RDS Subnet Groups ==="
          aws rds describe-db-subnet-groups --query "DBSubnetGroups[?DBSubnetGroupName=='app-${ENV}-subnet-group']" --output table 2>/dev/null || echo "app-${ENV}-subnet-group not found"
          
          echo ""
          echo "=== ECR Repositories ==="
          aws ecr describe-repositories --repository-names ${ENV}-frontend 2>/dev/null && echo "${ENV}-frontend found" || echo "${ENV}-frontend not found"
          aws ecr describe-repositories --repository-names ${ENV}-backend 2>/dev/null && echo "${ENV}-backend found" || echo "${ENV}-backend not found"
          aws ecr describe-repositories --repository-names ${ENV}-auth 2>/dev/null && echo "${ENV}-auth found" || echo "${ENV}-auth not found"
          
          echo ""
          echo "=== Secrets Manager ==="
          aws secretsmanager describe-secret --secret-id ${ENV}-app-secretkey 2>/dev/null && echo "${ENV}-app-secretkey found" || echo "${ENV}-app-secretkey not found"
          
          echo ""
          echo "=== EC2 Key Pairs ==="
          aws ec2 describe-key-pairs --key-names ${ENV}-ec2-key 2>/dev/null && echo "${ENV}-ec2-key found" || echo "${ENV}-ec2-key not found"
          
          echo ""
          echo "=== Security Groups ==="
          aws ec2 describe-security-groups --filters "Name=group-name,Values=${ENV}-ec2-sg" 2>/dev/null && echo "${ENV}-ec2-sg found" || echo "${ENV}-ec2-sg not found"
          aws ec2 describe-security-groups --filters "Name=group-name,Values=app-${ENV}-rds-sg" 2>/dev/null && echo "app-${ENV}-rds-sg found" || echo "app-${ENV}-rds-sg not found"
          
          echo ""
          echo "=== SSM Parameters ==="
          aws ssm get-parameter --name "/${ENV}/rds_db_secret" 2>/dev/null && echo "/${ENV}/rds_db_secret found" || echo "/${ENV}/rds_db_secret not found"
          aws ssm get-parameter --name "/${ENV}/rds_endpoint" 2>/dev/null && echo "/${ENV}/rds_endpoint found" || echo "/${ENV}/rds_endpoint not found"
          
          echo ""
          echo "=========================================="
        
      - name: Terraform apply
        working-directory: aws
        run: terraform apply -auto-approve -var-file="environnement/${{ inputs.env_name }}.tfvars"

      - name: Get Terraform outputs
        id: tf_outputs
        working-directory: aws
        run: |
          terraform output -json > /tmp/tf_outputs.json
          echo "public_ip=$(python - <<'PY'
          import json
          output=json.load(open('/tmp/tf_outputs.json'))
          print(output['ec2_instance_public_ip']['value'])
          PY)" >> $GITHUB_OUTPUT
          echo "secret_name=$(python - <<'PY'
          import json
          output=json.load(open('/tmp/tf_outputs.json'))
          print(output['ec2_secret_key_name']['value'])
          PY)" >> $GITHUB_OUTPUT
